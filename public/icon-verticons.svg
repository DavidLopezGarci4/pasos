<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <!-- Multi-tier Verticons Material Shadows -->
    <filter id="vertShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="32" stdDeviation="40" flood-color="#06120b" flood-opacity="0.55"/>
    </filter>

    <!-- Vertical Card Gradient -->
    <linearGradient id="vertCardBg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#497258"/>
      <stop offset="22%" stop-color="#365843"/>
      <stop offset="65%" stop-color="#243f30"/>
      <stop offset="100%" stop-color="#14261b"/>
    </linearGradient>

    <!-- Top Card Ambient Glow -->
    <radialGradient id="vertTopGlow" cx="50%" cy="12%" r="60%">
      <stop offset="0%" stop-color="#72aa86" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#72aa86" stop-opacity="0"/>
    </radialGradient>

    <!-- Floating Badge Gradient -->
    <linearGradient id="badgeGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#fbfdf7"/>
      <stop offset="55%" stop-color="#ebf2e2"/>
      <stop offset="100%" stop-color="#d6e3c9"/>
    </linearGradient>

    <!-- Inner Badge Shadow -->
    <filter id="badgeShadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#07150d" flood-opacity="0.42"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#07150d" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ================= VERTICAL RECTANGULAR CARD (Full 2:3 Verticon Standard) ================= -->
  <g>
    <!-- Base Card Body -->
    <rect x="0" y="0" width="800" height="1200" rx="140" fill="url(#vertCardBg)"/>
    <rect x="0" y="0" width="800" height="1200" rx="140" fill="url(#vertTopGlow)"/>

    <!-- Dual Border Framing (Outer subtle emerald accent & inner crisp highlight) -->
    <rect x="2" y="2" width="796" height="1196" rx="138" fill="none" stroke="#52a06c" stroke-opacity="0.45" stroke-width="4"/>
    <rect x="8" y="8" width="784" height="1184" rx="132" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="3"/>
  </g>

  <!-- ================= TOP CONTEXTUAL PILL ================= -->
  <rect x="310" y="80" width="180" height="42" rx="21" fill="#ffffff" fill-opacity="0.13"/>
  <circle cx="350" cy="101" r="7.5" fill="#f4be5e"/>
  <circle cx="400" cy="101" r="7.5" fill="#c87a58"/>
  <circle cx="450" cy="101" r="7.5" fill="#e9eedf"/>

  <!-- ================= CENTER HERO BADGE (Expanded & Proportional) ================= -->
  <g filter="url(#badgeShadow)">
    <rect x="175" y="260" width="450" height="450" rx="124" fill="url(#badgeGrad)" transform="rotate(-5 400 485)"/>
    <rect x="179" y="264" width="442" height="442" rx="120" fill="none" stroke="#ffffff" stroke-opacity="0.92" stroke-width="4.5" transform="rotate(-5 400 485)"/>
  </g>

  <!-- Pasos Leaf Mark Inside Badge -->
  <g transform="rotate(-5 400 485)">
    <g transform="translate(400 485) scale(18) translate(-12.8 -12.4)">
      <path d="M20 3C5 1 1 10 6 16s16 3 14-13Z" fill="#416850" fill-opacity="0.22"/>
      <path d="M20 3C5 1 1 10 6 16s16 3 14-13Z" fill="none" stroke="#1b3224" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5 21C7.2 16.8 11.2 12.8 16.8 8.2" fill="none" stroke="#c87a58" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="20" cy="3" r="1.4" fill="#f4be5e"/>
    </g>
  </g>

  <!-- ================= BOTTOM CONTEXTUAL UI ================= -->
  <text x="400" y="825" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="14" fill="#f3f7ee">PASOS</text>

  <!-- Segmented progress bars -->
  <g transform="translate(0, 875)">
    <rect x="235" y="0" width="95" height="13" rx="6.5" fill="#f4be5e"/>
    <rect x="345" y="0" width="145" height="13" rx="6.5" fill="#c87a58"/>
    <rect x="505" y="0" width="60" height="13" rx="6.5" fill="#ffffff" fill-opacity="0.25"/>
  </g>

  <text x="400" y="995" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="5.5" fill="#c3d9bb" opacity="0.95">CRECEMOS EN FAMILIA</text>

  <g transform="translate(400, 1060)">
    <circle cx="0" cy="0" r="8" fill="#f4be5e" opacity="0.9"/>
  </g>
</svg>
